<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System 404</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --glow: #00ffcc; --red: #ff4444; --bg: #050505; --panel: #111; --blue: #5d5df5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { height: 100svh; background: #000; color: #ccc; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        #secret-ui { display: flex; flex-direction: column; height: 100svh; width: 100%; background: var(--bg); padding: 8px; }
        
        /* Status & Delivery UI */
        #status-bar { font-size: 0.7rem; padding-bottom: 5px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; background: #333; margin-right: 5px; }
        .active-dot { background: var(--glow); box-shadow: 0 0 5px var(--glow); }

        #chat-box { flex: 1; overflow-y: auto; border-left: 2px solid var(--glow); padding: 10px; font-size: 0.85rem; background: #000; margin: 5px 0; }
        .msg { margin-bottom: 12px; position: relative; padding-bottom: 10px; border-bottom: 1px solid #111; }
        .tick { font-size: 0.6rem; color: #444; position: absolute; right: 0; bottom: 2px; }
        .delivered { color: var(--glow) !important; }

        /* Controls */
        .controls { display: flex; flex-direction: column; gap: 5px; }
        .row { display: flex; gap: 5px; width: 100%; }
        input { flex: 1; background: var(--panel); border: 1px solid #222; color: white; padding: 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
        button { background: var(--panel); border: 1px solid var(--glow); color: var(--glow); padding: 10px; font-weight: bold; border-radius: 6px; font-size: 0.7rem; }

        /* Audio Visualizer Area */
        #v-area { background: var(--panel); border-radius: 8px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 5px; border: 1px solid #222; position: relative; overflow: hidden; }
        #v-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.3; pointer-events: none; }
        #timer { font-family: monospace; color: var(--red); font-weight: bold; z-index: 2; }

        #call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="secret-ui">
        <div id="status-bar">
            <span><span id="partner-dot" class="dot"></span> <span id="partner-status">OFFLINE</span></span>
            <span id="my-id-display">ID: ...</span>
        </div>

        <div id="chat-box">-- SECURE BOOT v8.0 --</div>

        <div id="call-overlay">
            <h2 id="call-msg" style="color:var(--blue); margin-bottom: 20px;">DIALING...</h2>
            <div class="row" style="justify-content: center; gap: 20px;">
                <button id="ans-btn" style="background:var(--glow); color:black; display:none; padding: 20px;" onclick="acceptCall()">ANSWER</button>
                <button style="background:var(--red); color:white; border:none; padding: 20px;" onclick="endCall()">END</button>
            </div>
        </div>

        <div class="controls">
            <div class="row"><input type="text" id="target" placeholder="Partner ID"><button onclick="connectToPeer()">LINK</button></div>
            <div class="row"><input type="text" id="m-in" placeholder="Message..."><button onclick="sendText()">SEND</button></div>
            
            <div class="row">
                <button onclick="document.getElementById('file-in').click()">IMG</button>
                <button onclick="startCall()" style="color:var(--blue); border-color:var(--blue); flex:2">VOICE CALL</button>
                <button onclick="sendHap('alert')" style="color:var(--red); border-color:var(--red)">PANIC</button>
            </div>
            <input type="file" id="file-in" accept="image/*" style="display:none" onchange="sendImg(this)">

            <div id="v-area">
                <canvas id="v-canvas"></canvas>
                <button id="v-start-btn" style="width:100%; height:50px;" onclick="startRec()">VOICE NOTE (60s)</button>
                <div id="rec-controls" style="display:none; z-index:2; gap:10px;">
                    <div id="timer">00:00</div>
                    <button onclick="togglePauseRec()" id="p-btn">PAUSE</button>
                    <button onclick="stopRec()" style="background:var(--red); border:none; color:white;">DONE</button>
                </div>
                <div id="preview-box" style="display:none; gap:5px; padding:5px; width:100%; z-index:2;">
                    <button id="pre-play" onclick="togglePreviewPlay()">PLAY</button>
                    <button onclick="sendVoice()" style="background:var(--glow); color:black; border:none; flex:2">SEND</button>
                    <button onclick="resetRec()">X</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let peer, conn, myName = "User", rec, chunks = [], currentCall, localStream;
        let audioData = null, previewAudio = new Audio(), seconds = 0, timerInt;
        let audioCtx, analyser, animId, ringtone;

        const savedID = localStorage.getItem('phantom_id') || Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('phantom_id', savedID);

        // Initialize
        peer = new Peer(savedID);
        peer.on('open', id => document.getElementById('my-id-display').innerText = "MY ID: " + id);
        
        peer.on('connection', c => {
            conn = c;
            setupConn();
        });

        peer.on('call', call => {
            currentCall = call;
            showCallUI("INCOMING CALL...", true);
            playRingtone(true);
        });

        function connectToPeer() {
            const tid = document.getElementById('target').value.toUpperCase();
            if(!tid) return;
            conn = peer.connect(tid);
            setupConn();
        }

        function setupConn() {
            conn.on('open', () => {
                log("SYSTEM", "SECURE LINK OPEN");
                // Heartbeat to check if online
                setInterval(() => { if(conn.open) conn.send({t:'hb'}); }, 3000);
            });
            conn.on('data', d => {
                if (d.t === 'hb') updateOnlineStatus();
                if (d.t === 'txt') { log(d.n, d.v, d.id); conn.send({t:'ack', id:d.id}); }
                if (d.t === 'ack') markDelivered(d.id);
                if (d.t === 'img') log(d.n, `<img src="${d.v}">`, d.id);
                if (d.t === 'voc') renderAudioMsg(d.n, d.v, d.id);
            });
        }

        // --- DELIVERY TICKET SYSTEM ---
        function sendText() {
            const v = document.getElementById('m-in').value;
            if(!v) return;
            const msgId = 'm' + Date.now();
            if(conn && conn.open) conn.send({t:'txt', v:v, n:myName, id:msgId});
            log("ME", v, msgId);
            document.getElementById('m-in').value = "";
        }

        function markDelivered(id) {
            const el = document.getElementById('tick-' + id);
            if(el) { el.innerText = "DELIVERED"; el.classList.add('delivered'); }
        }

        function log(n, m, id) {
            const b = document.getElementById('chat-box');
            const tickHtml = id ? `<span class="tick" id="tick-${id}">SENT</span>` : "";
            b.innerHTML += `<div class="msg"><span class="u-tag">[${n}]</span> ${m}${tickHtml}</div>`;
            b.scrollTop = b.scrollHeight;
        }

        // --- ONLINE STATUS ---
        let lastHb = 0;
        function updateOnlineStatus() {
            const dot = document.getElementById('partner-dot');
            const txt = document.getElementById('partner-status');
            dot.classList.add('active-dot');
            txt.innerText = "ONLINE";
            txt.style.color = "var(--glow)";
            clearTimeout(lastHb);
            lastHb = setTimeout(() => {
                dot.classList.remove('active-dot');
                txt.innerText = "OFFLINE";
                txt.style.color = "#444";
            }, 5000);
        }

        // --- CALL SYSTEM WITH RINGTONE ---
        function playRingtone(isIncoming) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            ringtone = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            ringtone.type = isIncoming ? 'sine' : 'square';
            ringtone.frequency.setValueAtTime(isIncoming ? 440 : 150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            ringtone.connect(gain);
            gain.connect(audioCtx.destination);
            ringtone.start();
        }

        async function startCall() {
            const tid = document.getElementById('target').value.toUpperCase();
            if(!tid) return;
            showCallUI("DIALING...", false);
            playRingtone(false);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            currentCall = peer.call(tid, localStream);
            currentCall.on('stream', s => { stopRingtone(); playStream(s); });
        }

        async function acceptCall() {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            currentCall.answer(localStream);
            stopRingtone();
            showCallUI("CONNECTED", false);
            currentCall.on('stream', s => playStream(s));
        }

        function stopRingtone() { if(ringtone) { ringtone.stop(); ringtone = null; } }
        function showCallUI(msg, showAns) {
            document.getElementById('call-overlay').style.display = 'flex';
            document.getElementById('call-msg').innerText = msg;
            document.getElementById('ans-btn').style.display = showAns ? 'block' : 'none';
        }
        function endCall() {
            location.reload(); // Cleanest way to kill all streams on low-end phones
        }
        function playStream(s) { const a = new Audio(); a.srcObject = s; a.play(); }

        // --- VOICE NOTE & VISUALIZER ---
        async function startRec() {
            const s = await navigator.mediaDevices.getUserMedia({ audio: true });
            startVis(s);
            rec = new MediaRecorder(s);
            chunks = [];
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                const b = new Blob(chunks, { type: 'audio/webm' });
                audioData = URL.createObjectURL(b);
                previewAudio.src = audioData;
                document.getElementById('preview-box').style.display = 'flex';
                document.getElementById('rec-controls').style.display = 'none';
                s.getTracks().forEach(t => t.stop());
            };
            rec.start();
            document.getElementById('v-start-btn').style.display = 'none';
            document.getElementById('rec-controls').style.display = 'flex';
            startTimer();
        }

        function startVis(stream) {
            const ctx = document.getElementById('v-canvas').getContext('2d');
            const ac = new AudioContext();
            const src = ac.createMediaStreamSource(stream);
            const ana = ac.createAnalyser();
            src.connect(ana);
            const data = new Uint8Array(ana.frequencyBinCount);
            function draw() {
                animId = requestAnimationFrame(draw);
                ana.getByteFrequencyData(data);
                ctx.clearRect(0,0,300,150);
                ctx.fillStyle = '#00ffcc';
                data.forEach((v, i) => ctx.fillRect(i*3, 60-v/4, 2, v/2));
            }
            draw();
        }

        function stopRec() { rec.stop(); clearInterval(timerInt); cancelAnimationFrame(animId); }
        function startTimer() { 
            seconds = 0; 
            timerInt = setInterval(() => { 
                seconds++; 
                document.getElementById('timer').innerText = `00:${seconds.toString().padStart(2,'0')}`;
                if(seconds >= 60) stopRec();
            }, 1000); 
        }
        function resetRec() { location.reload(); }
        async function sendVoice() {
            const b = await fetch(audioData).then(r => r.blob());
            const f = new FileReader();
            f.onload = () => { 
                const id = 'v'+Date.now();
                if(conn) conn.send({t:'voc', v:f.result, n:myName, id:id});
                renderAudioMsg("ME", f.result, id);
                document.getElementById('preview-box').style.display = 'none';
                document.getElementById('v-start-btn').style.display = 'block';
            };
            f.readAsDataURL(b);
        }

        function renderAudioMsg(n, v, id) {
            const aid = "a"+id;
            log(n, `<button onclick="document.getElementById('${aid}').play()" style="padding:5px;">PLAY VN</button><audio id="${aid}" src="${v}"></audio>`, id);
        }

        function togglePreviewPlay() { previewAudio.paused ? previewAudio.play() : previewAudio.pause(); }
        function sendHap(v) { if(conn) conn.send({t:'hap', v:v, n:myName}); navigator.vibrate([100,50,100]); }
        function sendImg(i) {
            const r = new FileReader();
            r.onload = e => { if(conn) conn.send({t:'img', v:e.target.result, n:myName, id:'i'+Date.now()}); log("ME", `<img src="${e.target.result}">`, 'i'+Date.now()); };
            r.readAsDataURL(i.files[0]);
        }
    </script>
</body>
</html>
